<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FinRAG · Workflow Explorer</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <script type="module" src="/static/js/main.js"></script>
</head>
<body>
<header><a href="/" class="brand">F<span>FinRAG</span></a><span class="subtle">WORKFLOW EXPLORER</span><div class="header-status"><span id="health">检查环境…</span><a href="/docs" target="_blank" rel="noopener">API ↗</a></div></header>
<main>
<section class="composer">
  <div class="eyebrow">SOURCE-GROUNDED FINANCIAL RESEARCH</div><h1>财报分析工作台</h1>
  <p class="intro">输入问题，查看资料如何成为答案。也可以打开已保存的真实运行，逐步检查。</p>
  <form id="query-form">
    <label class="sr-only" for="question">研究问题</label>
    <textarea id="question" required maxlength="16000" rows="2" placeholder="比较 NVDA 和 AMD 的数据中心业务收入，并说明财年与披露口径差异。"></textarea>
    <div class="form-row"><label>公开截止日 <input id="as-of" type="date" required></label><label>执行范围 <select id="mode"><option value="answer">检索并生成答案</option><option value="retrieve">仅检索与上下文</option></select></label><details><summary>阅读背景与确认范围</summary><textarea id="background" rows="2" placeholder="补充公司、报告财年或章节"></textarea><textarea id="confirmed" rows="2" placeholder='已确认范围 JSON（可选），例如 {"ticker":"AMD","report_years":[2025]}'></textarea></details><button id="submit" class="primary">运行查询 ↗</button><button id="cancel" type="button" hidden>取消</button></div>
    <div id="budget" class="hint">新运行可能调用付费 API；历史记录与回放不收费。</div>
  </form>
</section>
<div id="notice" role="status" class="notice" hidden></div>
<section class="workspace">
  <div class="toolbar"><div><span class="eyebrow" id="view-mode">SAVED RUN</span><h2>执行过程</h2></div><div class="history"><label class="sr-only" for="run-select">记录来源</label><select id="run-select"></select><label class="sr-only" for="case-select">选择问题</label><select id="case-select"></select><button id="load">打开记录</button><button id="refresh" aria-label="刷新记录">↻</button></div></div>
  <div id="run-heading" class="run-heading">选择历史记录，或运行一个新问题。</div>
  <div class="playback"><button id="previous" aria-label="上一步">←</button><button id="play">播放记录</button><button id="next" aria-label="下一步">→</button><input id="scrubber" aria-label="已记录节点进度" type="range" min="0" max="0" value="0"><span id="play-position">—</span><label class="small"><input id="show-optional" type="checkbox">显示可选节点</label></div>
  <div id="stats" class="stats"></div>
  <div class="execution-grid"><nav id="workflow" aria-label="真实LangGraph工作流"></nav><section class="inspector"><div class="inspector-title"><div><span class="eyebrow">STEP INSPECTOR</span><h2 id="step-title">选择步骤</h2></div><span id="step-timing" class="mono"></span></div><p id="step-description" class="subtle"></p><div id="step-tabs" class="tabs"></div><div id="step-content"></div></section></div>
</section>
<section class="results"><div id="result-tabs" class="tabs"></div><div id="result-content"></div></section>
<footer>仅使用已发布资料库。引用存在、结构有效不代表财务结论已经审核通过。历史回放不会执行模型。</footer>
</main>
<dialog id="detail-dialog"><div class="dialog-header"><h2 id="detail-title"></h2><button id="close-dialog" aria-label="关闭">×</button></div><div id="detail-content"></div></dialog>
</body></html>
