name: Unit contracts and publication hygiene
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python scripts/check_publication.py
      - run: ruff check src tests --exclude src/finrag/vendor
      - run: python scripts/verify_public_evidence.py
      - run: pytest -q
